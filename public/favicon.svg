<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4A3" />
      <stop offset="100%" stop-color="#1B9371" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B9371" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="18" fill="url(#mintGrad)" filter="url(#glow)" />

  <!-- Subtle Stopwatch Dial Arc -->
  <circle cx="32" cy="32" r="23" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="100 45" />

  <!-- Top Timer Node / Dial Accent -->
  <circle cx="32" cy="9" r="2.5" fill="#FFFFFF" />

  <!-- Stylized Modern '20' Monogram -->
  <!-- The '2' -->
  <path d="M 21 24 C 21 20.5 24 18.5 28 18.5 C 32 18.5 34 20.8 33.5 24.5 C 33 28 28.5 32 22 38.5 L 34.5 38.5" 
        stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- The '0' Ring with inner athletic gap -->
  <ellipse cx="43.5" cy="30" rx="6" ry="9" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" />
  
  <!-- Tiny energetic spark dot in the center of 0 -->
  <circle cx="43.5" cy="30" r="1.5" fill="#FFFFFF" />
</svg>
